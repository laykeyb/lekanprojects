<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Cash Register</title>
</head>

<body>
  <main>
    <h1>Cash Register Project</h1>
    <div id="change-due">
        
      </div>
    <form id="form">
      <label for="cash">Enter cash from customer:</label>
      <input id="cash" name="cash" type="number" step="0.01"/>
      <button id="purchase-btn" type="submit" value="purchase">Purchase</button>
    </form>

    <div class="cash-register">


      <div class="price-head-and-neck">
        <div class="price-display-container">
          <div class="price-display">
            Total: $<span id="price"></span>
          </div>
        </div>
        <div class="cash-register-neck"></div>
      </div>
      
      <div class="cash-register-body">
        <div class="cash-register-inner-body">
          
            <div class="cash-register-inputs-container">
              <div class="cash-register-input-buttons"></div>
              <div class="cash-register-input-buttons"></div>
              <div class="cash-register-input-buttons"></div>
              <div class="cash-register-input-buttons"></div>
              <div class="cash-register-input-buttons"></div>
              <div class="cash-register-input-buttons"></div>
              <div class="cash-register-input-buttons"></div>
              <div class="cash-register-input-buttons"></div>
              <div class="cash-register-input-buttons"></div>
          </div>
          <div id="change-drawer">
            <h2>Change in drawer</h2>
            <p>Pennies: <span id="pennySpan"></span></p>
            <p>Nickels: <span id="nickelSpan"></span></p>
            <p>Dimes :<span id="dimeSpan"></span></p>
            <p>Quaters: <span id="quaterSpan"></span></p>
            <p>Ones: <span id="oneSpan"></span></p>
            <p>Fives: <span id="fiveSpan"></span></p>
            <p>Tens: <span id="tenSpan"></span></p>
            <p>Twenties: <span id="twentieSpan"></span></p>
            <p>Hundreds: <span id="hundredSpan"></span></p>
          </div>
        </div>
      </div>

      <div class="cash-register-bottom">
        <div class="circle"></div>
      </div>
    </div>
  </main>
  <script src="./script.js"></script>
</body>

</html>
